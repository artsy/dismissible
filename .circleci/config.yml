version: 2.1

orbs:
  auto: artsy/auto@dev:2aef03cbfbbf0911d52c58abd31a4457
  node: circleci/node@6.3.0

workflows:
  build_and_verify:
    jobs:
      - node/run:
          name: lint
          pkg-manager: yarn
          yarn-run: lint
          version: 18.15.0

      - node/run:
          name: type-check
          pkg-manager: yarn
          yarn-run: type-check
          version: 18.15.0

      - node/run:
          name: test
          pkg-manager: yarn
          yarn-run: test
          version: 18.15.0

      - auto/publish-canary:
          context: npm-deploy
          filters:
            branches:
              ignore: main
          node-version: "22.23.4"
          requires:
            - test
            - lint
            - type-check

      - auto/publish:
          context: npm-deploy
          filters:
            branches:
              only: main
          node-version: "22.23.4"
          requires:
            - test
            - lint
            - type-check
